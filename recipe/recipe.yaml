schema_version: 1

context:
  name: dtool_info
  version: "0.16.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-info/${{ name }}-${{ version }}.tar.gz
  sha256: 81eb3016754b7ae19998ad5c4193d5a096f1500f25a0a38e5ad98525cec62a37

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - click
    - setuptools <80
    - dtoolcore
    - dtool_cli
    - jinja2
    - pygments

tests:
  - python:
      imports:
        - dtool_info
        - dtool_info.dataset
        - dtool_info.inventory
        - dtool_info.overlay
        - dtool_info.templates
        - dtool_info.utils
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - dtool diff --help
      - dtool ls --help
      - dtool summary --help
      - dtool item --help
      - dtool identifiers --help
      - dtool verify --help
      - dtool overlay --help
      - dtool inventory --help
      - dtool uuid --help

about:
  license: MIT
  license_file: LICENSE
  summary: dtool CLI commands for getting information about datasets
  homepage: https://github.com/jic-dtool/dtool-info
  repository: https://github.com/jic-dtool/dtool-info
  documentation: https://github.com/jic-dtool/dtool-info

extra:
  recipe-maintainers:
    - pvanheus
    - jan-janssen
    - tjelvar-olsson
